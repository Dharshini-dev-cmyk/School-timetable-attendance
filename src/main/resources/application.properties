# ============================================================
# School Timetable and Attendance Management System
# Common Application Configuration
# ============================================================
# This file holds ALL shared configuration.
# Profile-specific files (application-docker.properties,
# application-local.properties) only override the datasource
# URL, username, and password.
# ============================================================

# --- Server ---
server.port=8080

# --- Active Profile ---
# Default profile when running from IntelliJ / VS Code.
# Override at runtime with:
#   -Dspring.profiles.active=docker   (command line)
#   SPRING_PROFILES_ACTIVE=docker    (environment variable)
spring.profiles.active=local

# --- MySQL DataSource (driver is common; URL/user/pass are profile-specific) ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- SQL Initialization ---
# Hibernate (ddl-auto=update) manages the schema, so we do not
# run Spring's built-in schema.sql / data.sql scripts.
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

# --- HikariCP Connection Pool ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- JWT ---
app.jwt.secret=${JWT_SECRET:SchoolTimetableAttendanceSecretKey256BitLongForHS256Algorithm}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Role-specific expiry (ms): 8h students/parents, 12h teachers, 24h admin
app.jwt.expiration-student-ms=28800000
app.jwt.expiration-teacher-ms=43200000
app.jwt.expiration-admin-ms=86400000

# --- Login Security ---
# Max failed attempts before lockout. Set to 10 to reduce accidental
# lockouts for students/teachers who mistype their password.
app.login.max-attempts=10
# Lockout duration in minutes. Set to 5 so a locked-out user can try
# again within a single class period instead of waiting 15 minutes.
app.login.lockout-duration-minutes=5

# --- Swagger / OpenAPI ---
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# --- Logging ---
logging.level.org.springframework.security=DEBUG
logging.level.com.examly.springapp=DEBUG
logging.level.org.hibernate.SQL=DEBUG
