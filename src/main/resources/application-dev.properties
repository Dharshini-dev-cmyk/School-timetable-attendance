# ============================================================
# Development Profile — MySQL (via Docker)
# ============================================================
# MySQL runs in Docker via `docker-compose up`.
# When running the app locally (mvn spring-boot:run), it connects
# to MySQL on localhost:3307.
# When running inside Docker Compose, SPRING_DATASOURCE_URL
# environment variable overrides this to use the service name 'mysql'.
# ============================================================

# --- MySQL DataSource ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/school_attendance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:school_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:school_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- HikariCP Connection Pool ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- Logging ---
logging.level.com.examly.springapp=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG