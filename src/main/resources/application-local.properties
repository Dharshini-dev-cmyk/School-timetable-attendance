# ============================================================
# Local Profile — Local MySQL
# ============================================================
# Activated automatically (default) when running the app from
# IntelliJ / VS Code via `spring.profiles.active=local` in
# application.properties, or by setting SPRING_PROFILES_ACTIVE=local.
#
# Connects to MySQL running on localhost:3306.
# ============================================================

# --- MySQL DataSource ---
spring.datasource.url=jdbc:mysql://localhost:3306/school_attendance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
