# ============================================================
# Docker Profile — MySQL Container
# ============================================================
# Activated automatically when the app runs inside Docker
# (Dockerfile ENV or docker-compose.yml environment sets
# SPRING_PROFILES_ACTIVE=docker).
#
# Connects to the MySQL service container named 'mysql'
# on the shared Docker network.
# ============================================================

# --- MySQL DataSource ---
spring.datasource.url=jdbc:mysql://mysql:3306/school_attendance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
