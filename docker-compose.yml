version: '3.8'

services:

  # ── MySQL Database ──────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: school_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: school_attendance_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - school_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Application ─────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Activate the 'docker' Spring profile so the app connects
      # to the MySQL container using root/root (see application-docker.properties)
      SPRING_PROFILES_ACTIVE: docker
      APP_JWT_SECRET: ${JWT_SECRET:-SchoolTimetableAttendanceSecretKey256BitLongForHS256Algorithm}
      APP_JWT_EXPIRATION_MS: 86400000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - school_network

volumes:
  mysql_data:
    driver: local

networks:
  school_network:
    driver: bridge
